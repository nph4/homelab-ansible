# Nightly encrypted backup of host-only secrets to the NAS.
#
# Installs /usr/local/sbin/secrets-backup and a root cron entry. The script tars the paths in the host's
# `secrets_backup_paths` (inventory; absolute paths or globs) and encrypts them with age to
# `secrets_backup_recipients`, writing {{ secrets_backup_dest }}/<host>/secrets_<date>.tar.age and keeping
# the newest {{ secrets_backup_keep }}. Only public keys are on the hosts; the private key is kept off
# the homelab (password manager), so the NAS and CrashPlan only ever hold ciphertext. The default 00:40
# run is before 01:00 (01:00-03:00 is avoided: DST changeovers skip or repeat those times) and before
# CrashPlan's 03:00 scan of the share. Installing it runs nothing; run `sudo secrets-backup` to test.

- name: Nightly encrypted secrets backups to the NAS
  hosts: secrets_backup
  become: true

  vars:
    secrets_backup_dest: /mnt/nas/backups/secrets
    secrets_backup_keep: 30
    secrets_backup_minute: "40"
    secrets_backup_hour: "0"
    # age public keys; the matching private key is not on any host
    secrets_backup_recipients:
      - age1dler9lh8e2w46l8kydpnaqdep0xeuk3lawj07pgcfw5r3p3xf3dsaep2ct  # private key: password manager, 2026-10-17
    # Optional Uptime Kuma push monitor URL (without query string); empty disables it
    secrets_backup_push_url: ""

  tasks:
    - name: Install age
      apt:
        name: age
        state: present

    - name: Install the backup script
      copy:
        src: ../files/secrets-backup.sh
        dest: /usr/local/sbin/secrets-backup
        mode: "0755"

    - name: Config directory
      file:
        path: /etc/secrets-backup
        state: directory
        mode: "0755"

    - name: Recipients
      copy:
        dest: /etc/secrets-backup/recipients
        mode: "0644"
        content: |
          # Managed by homelab-ansible (playbooks/secrets-backup.yml)
          {% for r in secrets_backup_recipients %}
          {{ r }}
          {% endfor %}

    - name: Paths to back up
      copy:
        dest: /etc/secrets-backup/paths
        mode: "0644"
        content: |
          # Managed by homelab-ansible (inventory: secrets_backup_paths)
          {% for p in secrets_backup_paths %}
          {{ p }}
          {% endfor %}

    - name: Schedule it
      copy:
        dest: /etc/cron.d/secrets-backup
        mode: "0644"
        content: |
          # Managed by homelab-ansible (playbooks/secrets-backup.yml)
          SECRETS_BACKUP_DEST={{ secrets_backup_dest }}
          SECRETS_BACKUP_KEEP={{ secrets_backup_keep }}
          SECRETS_BACKUP_PUSH_URL="{{ secrets_backup_push_url }}"
          {{ secrets_backup_minute }} {{ secrets_backup_hour }} * * * root /usr/local/sbin/secrets-backup >>/var/log/secrets-backup.log 2>&1

    - name: Rotate its log
      copy:
        dest: /etc/logrotate.d/secrets-backup
        mode: "0644"
        content: |
          /var/log/secrets-backup.log {
              monthly
              rotate 6
              compress
              missingok
              notifempty
          }
